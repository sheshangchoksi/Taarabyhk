<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — TaaraByHK</title>
<link rel="icon" type="image/png" href="images/brand/favicon-32.png">
<link rel="stylesheet" href="css/style.css">
<!-- Social share preview (Open Graph + Twitter Card) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="TaaraByHK">
<meta property="og:title" content="Order Confirmed — TaaraByHK">
<meta property="og:description" content="Thank you for your order with TaaraByHK.">
<meta property="og:url" content="https://taarabyhk.vercel.app/order-confirmed.html">
<meta property="og:image" content="https://taarabyhk.vercel.app/images/brand/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Order Confirmed — TaaraByHK">
<meta name="twitter:description" content="Thank you for your order with TaaraByHK.">
<meta name="twitter:image" content="https://taarabyhk.vercel.app/images/brand/og-image.png">

</head>
<body data-nav="">

<header class="site-header" id="site-header"></header>

<main class="wrap">
  <div class="confirm-box" id="confirmBox">
    <div class="check-circle">✓</div>
    <h1 style="margin-bottom:10px;">Thank you!</h1>
    <p style="color:var(--ink-soft);">We've received your order and will confirm your payment shortly.</p>
    <div id="orderDetails" style="margin-top:24px;"></div>
    <a href="shop.html" class="btn btn-outline" style="margin-top:26px;">Continue Shopping</a>
  </div>
</main>

<footer class="site-footer" id="site-footer" style="margin-top:40px;"></footer>

<script src="js/main.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const raw = sessionStorage.getItem("taara_last_order");
    if (!raw) return;
    const o = JSON.parse(raw);
    document.getElementById("orderDetails").innerHTML = `
      <div class="order-summary-mini" style="text-align:left;">
        <div class="row"><span>Order reference</span><span style="font-family:monospace;">${o.code}</span></div>
        <div class="row"><span>Name</span><span>${o.name}</span></div>
        <div class="row" style="font-weight:800;"><span>Amount</span><span>₹${o.total.toLocaleString("en-IN")}</span></div>
      </div>
      <p style="font-size:.82rem;color:var(--ink-soft);margin-top:14px;">Save this reference — quote it if you contact us about your order.</p>
    `;
  });
</script>
</body>
</html>
